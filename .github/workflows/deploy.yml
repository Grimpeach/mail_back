name: CI/CD Pipeline for Mail Backend

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'terraform/**'
      - 'README.md'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mail-backend:${{ github.sha }}

      - name: Update Kubernetes manifests
        run: |
          sed -i -E "s|image: .*mail-backend.*|image: ${{ secrets.DOCKER_USERNAME }}/mail-backend:${{ github.sha }}|g" k8s/backend.yaml

      - name: Commit and push updated manifests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/backend.yaml
          git commit -m "ci: update kubernetes manifests with image tag ${{ github.sha }} [skip ci]"
          git push