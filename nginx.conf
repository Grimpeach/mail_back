events {
    # Maximum number of simultaneous connections that can be opened by a worker process
    worker_connections 1024;
}

http {
    # Define the group of backend servers
    upstream mail_backend {
        # Round Robin balancing by default
        server mail-backend-1:8080;
        server mail-backend-2:8080;
    }

    server {
        # Nginx will listen on port 80
        listen 80;

        location / {
            # Forward all requests to the upstream group
            proxy_pass http://mail_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}